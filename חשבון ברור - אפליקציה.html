<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חשבון ברור - ניהול תקציב אישי</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('heshbon_transactions');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: 'משכורת', amount: 12000, type: 'income', category: 'עבודה', date: new Date().toISOString().split('T')[0] },
                    { id: 2, title: 'קניות בסופר', amount: 450, type: 'expense', category: 'מזון', date: new Date().toISOString().split('T')[0] },
                    { id: 3, title: 'חשמל', amount: 320, type: 'expense', category: 'חשבונות', date: new Date().toISOString().split('T')[0] }
                ];
            });

            const [title, setTitle] = useState('');
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('expense');
            const [category, setCategory] = useState('כללי');

            useEffect(() => {
                localStorage.setItem('heshbon_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const addTransaction = (e) => {
                e.preventDefault();
                if (!title || !amount) return;

                const newTx = {
                    id: Date.now(),
                    title,
                    amount: parseFloat(amount),
                    type,
                    category,
                    date: new Date().toISOString().split('T')[0]
                };

                setTransactions([newTx, ...transactions]);
                setTitle('');
                setAmount('');
            };

            const deleteTransaction = (id) => {
                setTransactions(transactions.filter(t => t.id !== id));
            };

            const income = transactions
                .filter(t => t.type === 'income')
                .reduce((acc, t) => acc + t.amount, 0);

            const expenses = transactions
                .filter(t => t.type === 'expense')
                .reduce((acc, t) => acc + t.amount, 0);

            const balance = income - expenses;

            return (
                <div class="max-w-md mx-auto min-h-screen pb-12 shadow-lg bg-white">
                    {/* Header */}
                    <header class="bg-indigo-600 text-white p-6 rounded-b-3xl shadow-md">
                        <div class="flex justify-between items-center mb-4">
                            <h1 class="text-2xl font-bold flex items-center gap-2">
                                <i data-lucide="wallet" class="w-7 h-7"></i>
                                חשבון ברור
                            </h1>
                            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full">גרסה 1.0</span>
                        </div>
                        
                        {/* Balance Card */}
                        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 text-center mt-2 border border-white/20">
                            <span class="text-sm font-light text-indigo-100">יתרה נוכחית</span>
                            <div class={`text-3xl font-extrabold mt-1 ${balance >= 0 ? 'text-white' : 'text-red-200'}`}>
                                ₪{balance.toLocaleString()}
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-white/10 text-sm">
                                <div class="flex items-center justify-center gap-1 text-emerald-300">
                                    <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
                                    <span>הכנסות: ₪{income.toLocaleString()}</span>
                                </div>
                                <div class="flex items-center justify-center gap-1 text-rose-300">
                                    <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                                    <span>הוצאות: ₪{expenses.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main class="p-5 space-y-6">
                        {/* Add Form */}
                        <form onSubmit={addTransaction} class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                            <h2 class="font-semibold text-slate-700 text-sm flex items-center gap-1.5">
                                <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i>
                                הוספת תנועה חדשה
                            </h2>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <button
                                    type="button"
                                    onClick={() => setType('expense')}
                                    class={`py-2 rounded-lg text-sm font-medium transition ${type === 'expense' ? 'bg-rose-500 text-white shadow-sm' : 'bg-slate-200 text-slate-600'}`}
                                >
                                    הוצאה
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setType('income')}
                                    class={`py-2 rounded-lg text-sm font-medium transition ${type === 'income' ? 'bg-emerald-500 text-white shadow-sm' : 'bg-slate-200 text-slate-600'}`}
                                >
                                    הכנסה
                                </button>
                            </div>

                            <input
                                type="text"
                                placeholder="תיאור (למשל: קניות סופר)"
                                value={title}
                                onChange={(e) => setTitle(e.target.value)}
                                class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                required
                            />

                            <div class="grid grid-cols-2 gap-2">
                                <input
                                    type="number"
                                    placeholder="סכום (₪)"
                                    value={amount}
                                    onChange={(e) => setAmount(e.target.value)}
                                    class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    required
                                />
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    class="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                >
                                    <option value="כללי">כללי</option>
                                    <option value="מזון">מזון</option>
                                    <option value="חשבונות">חשבונות</option>
                                    <option value="עבודה">עבודה</option>
                                    <option value="פנאי">פנאי</option>
                                    <option value="תחבורה">תחבורה</option>
                                </select>
                            </div>

                            <button
                                type="submit"
                                class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 transition shadow-sm"
                            >
                                שמור תנועה
                            </button>
                        </form>

                        {/* Recent Transactions List */}
                        <div>
                            <h2 class="font-semibold text-slate-700 text-sm mb-3 flex items-center justify-between">
                                <span>תנועות אחרונות</span>
                                <span class="text-xs text-slate-400">סה"כ: {transactions.length}</span>
                            </h2>

                            {transactions.length === 0 ? (
                                <p class="text-center text-slate-400 py-6 text-sm">אין תנועות להצגה</p>
                            ) : (
                                <div class="space-y-2">
                                    {transactions.map(item => (
                                        <div key={item.id} class="bg-white border border-slate-100 p-3.5 rounded-xl shadow-sm flex justify-between items-center hover:shadow-md transition">
                                            <div class="flex items-center gap-3">
                                                <div class={`p-2.5 rounded-full ${item.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                                                    <i data-lucide={item.type === 'income' ? 'trending-up' : 'trending-down'} class="w-4 h-4"></i>
                                                </div>
                                                <div>
                                                    <div class="font-semibold text-sm text-slate-800">{item.title}</div>
                                                    <div class="text-xs text-slate-400 flex gap-2">
                                                        <span>{item.category}</span>
                                                        <span>•</span>
                                                        <span>{item.date}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-3">
                                                <span class={`font-bold text-sm ${item.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}`}>
                                                    {item.type === 'income' ? '+' : '-'}₪{item.amount.toLocaleString()}
                                                </span>
                                                <button
                                                    onClick={() => deleteTransaction(item.id)}
                                                    class="text-slate-300 hover:text-rose-500 transition"
                                                >
                                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
